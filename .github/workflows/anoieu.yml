name: anoieu

on: [push, pull_request]

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the policy, at the commit this repository pins
        env:
          # Moved by hand, and only to a commit where anoieu's own CI is green.
          # kanon's scripts/bump_check.py decides that; it reads a remote, so it
          # is run at the moment of adoption and never from here.
          ANOIEU_REV: 442bb67
        run: |
          git clone --quiet https://github.com/ajreynol/anoieu /tmp/anoieu
          git -C /tmp/anoieu checkout --quiet "$ANOIEU_REV"
      - run: python3 /tmp/anoieu/scripts/policy_check.py --root .
