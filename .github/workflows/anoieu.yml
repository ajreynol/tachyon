name: anoieu

# The policy check, run by anoieu's own shared workflow at `main`, naming the
# mechanical contract this repository is held to rather than a checker commit.
# Contract 1 fixes the obligations and their severity while the implementation
# behind it stays free to change, so this build can turn red with nothing
# committed here -- and within a contract that means a violation already in the
# tree has started being reported, never a new requirement arriving.
#
# kanon's `docs/policy.md`, section `2. Run the check`, is the rule, and it
# accepts a pinned checker commit instead. This repository takes the contract,
# so there is nothing here to pin and nothing here to bump.
# docs/maintenance.md says how to reproduce this job locally.

on: [push, pull_request]

permissions:
  contents: read

jobs:
  policy:
    uses: ajreynol/anoieu/.github/workflows/policy.yml@main
    with:
      policy-version: '1'
