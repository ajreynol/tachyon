name: reports

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: check the site builders
        # Every project's builder suite, found the way scripts/check.py finds
        # them, so adding or removing a project changes nothing here and this
        # file names no research project.
        run: |
          python3 -m unittest discover -s tests -p 'test_site.py'
          for suite in tools/*/tests; do
            # A project that publishes nothing has no builder suite, which is
            # not a failure -- but `unittest discover` finding no test exits 5
            # from Python 3.12 on, so ask before running rather than after.
            [ -f "$suite/test_report.py" ] || continue
            python3 -m unittest discover -s "$suite" -p 'test_report.py'
          done
      - name: build the site from the recorded evidence
        run: python3 scripts/build_site.py
      - name: upload the site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    # Only main publishes; a pull request builds the site and stops there.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          # Creates the Pages site on the first deployment; without this the
          # action only reads an existing one and fails when there is none.
          enablement: true
      - name: deploy the site
        id: deployment
        uses: actions/deploy-pages@v4
