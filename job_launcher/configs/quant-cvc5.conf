# cvc5 on the set in the best known configuration (tools/heuresis/notes.md,
# "The configuration under study"): strict user patterns, no conflict-based
# instantiation, and explicit CaDiCaL.  The cvc5 side of the baseline
# (heuresis goal 1).
# Everything machine-specific comes from job_launcher/site.conf.
COMMENT="heuresis baseline: cvc5 best known configuration on the set"
TAG=u-ssc

BRANCH=                 # optional: build this branch of REPO first (then BINARY must be $REPO_BINARY)
DIR=$QUANT_DIR
DRIVER=solve_dir_rec_par_cvc5
TIMEOUT=30
BINARY=$CVC5_BIN
SCRIPT=cvc5_solve.sh
OPTS="-q --no-cbqi --user-pat=strict --sat-solver=cadical"
