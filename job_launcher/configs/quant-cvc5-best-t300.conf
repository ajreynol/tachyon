# S12: how many benchmarks does the --ee-mode=central --ieval=off segfault
# actually affect?  Every 30 s run reports zero errors and the single 120 s run
# reports two, but the crash needs roughly 20 s of CPU to reach, so a 30 s wall
# budget kills the process first and the scope has never been measured.  This
# is the best-known configuration at a 300 s timeout, which is also the arm
# that crashes.  With the wrapper's failure log (errors-*.txt) each failure now
# carries its reason.
COMMENT="heuresis S12: best configuration at 300 s, to size the segfault"
TAG=u-ssc-best-t300

BRANCH=
DIR=$QUANT_DIR
DRIVER=solve_dir_rec_par_cvc5
TIMEOUT=300
BINARY=$REPO_BINARY
SCRIPT=cvc5_solve.sh
OPTS="-q --no-cbqi --user-pat=strict --sat-solver=cadical --ee-mode=central --ieval=off"
