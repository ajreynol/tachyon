# R1/R28: sanity control for the eager-instantiation branch.  The module is
# default-off, but the branch touches instantiate.cpp and the quantifiers
# engine, so this arm establishes that the branch equals the combined
# current-main arm when --eager-inst is not given.  Any delta in the two
# --eager-inst arms is read against THIS, not against the main-built control.
COMMENT="heuresis R1/R28: claude-eagerInst with the module off (sanity control)"
TAG=u-ssc-eager-off

BRANCH=claude-eagerInst
DIR=$QUANT_DIR
DRIVER=solve_dir_rec_par_cvc5
TIMEOUT=30
BINARY=$REPO_BINARY
SCRIPT=cvc5_solve.sh
OPTS="-q --no-cbqi --user-pat=strict --sat-solver=cadical --ee-mode=central --ieval=off"
