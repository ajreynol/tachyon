# progress.md tracked configuration `best`, at the cvc5 1.4.0 release point.
# This is also the configuration that segfaults on two benchmarks; at a 30 s
# timeout neither reaches the fault, so the arm is unaffected here.
COMMENT="heuresis progress: best configuration at the 1.4.0 release"
TAG=u-ssc-best-140

BRANCH=
DIR=$QUANT_DIR
DRIVER=solve_dir_rec_par_cvc5
TIMEOUT=30
BINARY=$REPO_BINARY
SCRIPT=cvc5_solve.sh
OPTS="-q --no-cbqi --user-pat=strict --sat-solver=cadical --ee-mode=central --ieval=off"
