# R13: CaDiCaL is the declared default on current main, but default incremental
# solving still selects MiniSat unless the backend is user-set. Isolate that
# effective-backend change from the existing best-known quantifier bundle.
COMMENT="heuresis R13: best-known cvc5 configuration with explicit CaDiCaL"
TAG=u-ssc

BRANCH=
DIR=$QUANT_DIR
DRIVER=solve_dir_rec_par_cvc5
TIMEOUT=30
BINARY=$CVC5_BIN
SCRIPT=cvc5_solve.sh
OPTS="-q --no-cbqi --user-pat=strict --sat-solver=cadical"
