# R6/R28: capture QCF and quantifier timers for the conflict-only mainline
# proxy. Output goes to the host's ~/analysis/stats.
COMMENT="heuresis R6/R28: internal statistics with conflict-only CBQI"
TAG=u-sc-cbqi-conflict-stats

BRANCH=
DIR=$QUANT_DIR
DRIVER=stats_dir_rec_par_cvc5
TIMEOUT=30
BINARY=$CVC5_BIN
OPTS="-q --user-pat=strict --sat-solver=cadical --cbqi-mode=conflict"
