# heuresis R11, option sweep (wave 1): the reference plus `--jh-rlv-order`.
#
# The reference options are a FIXED PREFIX carried by every proposal arm, branch
# arms included, so that an arm differs from the reference in exactly one way and
# the difference in solved benchmarks is attributable to that one change.  See
# tools/heuresis/docs/directions.md, "The reference".
#
# BINARY must be the same build the reference row of docs/progress.md was
# measured on -- $REPO_BINARY, built from master by `submit --baseline`.  Running
# an arm against a different build makes its number meaningless.
# Everything machine-specific comes from job_launcher/site.conf.
COMMENT="heuresis R11 wave 1: reference + --jh-rlv-order"
TAG=w1-jh-rlv-order

BRANCH=                 # none: uses the installed $REPO_BINARY from the baseline build
DIR=$QUANT_DIR
DRIVER=solve_dir_rec_par_cvc5
TIMEOUT=30
BINARY=$REPO_BINARY
SCRIPT=cvc5_solve.sh
OPTS="-q --no-cbqi --user-pat=strict --sat-solver=cadical --jh-rlv-order"
