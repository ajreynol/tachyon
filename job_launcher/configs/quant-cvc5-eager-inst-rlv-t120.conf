# 29 of 6124 at 30 s, close enough to the boundary that they may be an
# artifact of the cutoff.  The control is included at 120 s because the real
# question is whether it reaches those benchmarks given four times the budget.
COMMENT="heuresis R1/R28 (S7): eager arm 'inst-rlv' at a 120 s timeout"
TAG=u-ssc-eager-inst-rlv-t120

BRANCH=claude-eagerInst
DIR=$QUANT_DIR
DRIVER=solve_dir_rec_par_cvc5
TIMEOUT=120
