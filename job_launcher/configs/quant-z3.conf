# z3 on the set: the other side of the baseline (heuresis goal 1).  Same
# timeout as quant-cvc5.conf, same host, or the gap is not a measurement.
# The tag is the binary name, so the job name records which z3 ran; the
# ledger entry records the version string.
#
# OPTS are the nine options Verus passes to z3 (source/air/src/context.rs,
# read 2026-09-15).  They are not optional: without
# them z3 times out on benchmarks it solves in a quarter of a second with
# them (ledger, 2026-09-14).  The benchmarks carry no set-option lines.
COMMENT="heuresis baseline: z3 on the set, Verus options"
TAG=$Z3_BIN            # the job name records which z3 ran

BRANCH=
DIR=$QUANT_DIR
DRIVER=solve_dir_rec_par_z3
TIMEOUT=30
BINARY=$Z3_BIN
SCRIPT=z3_solve.sh
OPTS="auto_config=false smt.mbqi=false smt.case_split=3 smt.qi.eager_threshold=100.0 smt.delay_units=true smt.arith.solver=2 smt.arith.nl=false pi.enabled=false rewriter.sort_disjunctions=false"
