# heuresis R6, option sweep (wave 1): the reference with `--no-cbqi` REMOVED.
#
# This is the one arm that SUBTRACTS from the reference instead of adding to it.
# Every other arm carries the fixed prefix unchanged and differs by one added
# option; here the prefix itself is the thing under test.  `cbqi` is default-on
# in cvc5, so the reference's `--no-cbqi` disables a default, and this arm prices
# that decision: it is the reference's own choice measured as a proposal.
# See tools/heuresis/docs/directions.md, "The reference".
#
# BINARY must be the same build the reference row of docs/progress.md was
# measured on -- $REPO_BINARY, built from master by `submit --baseline`.  Running
# an arm against a different build makes its number meaningless.
# Everything machine-specific comes from job_launcher/site.conf.
COMMENT="heuresis R6 wave 1: reference with --no-cbqi removed (--cbqi)"
TAG=w1-cbqi

BRANCH=                 # none: uses the installed $REPO_BINARY from the baseline build
DIR=$QUANT_DIR
DRIVER=solve_dir_rec_par_cvc5
TIMEOUT=30
BINARY=$REPO_BINARY
SCRIPT=cvc5_solve.sh
OPTS="-q --user-pat=strict --sat-solver=cadical --cbqi"
